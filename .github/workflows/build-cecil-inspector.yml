name: Build Cecil inspector Linux
on:
  push:
    branches:
      - chatgpt/cdshelper-startup-diagnosis-20261126
jobs:
  compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - shell: pwsh
        run: |
          dotnet publish tools/ILInspector/ILInspector.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o out --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: cecil-linux-inspector
          path: out/*
