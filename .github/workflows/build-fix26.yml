name: Build Fix26 hide 'tampered' from development history
on:
  push:
    branches:
      - chatgpt/cdshelper-fix26-hide-tampered-20261126
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish in-place Mono.Cecil display-only editor
        shell: pwsh
        run: |
          dotnet publish tools/Fix26/Fix26.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o output --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Fix26 editor compilation failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: Fix26-IL-Editor
          path: output/*
          if-no-files-found: error
