name: Build Fix31 safe Japanese UI translation patcher
on:
  push:
    branches:
      - chatgpt/cdshelper-fix31-stable-ui-20261126
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish Linux-capable Cecil editor
        shell: pwsh
        run: |
          dotnet publish tools/Fix30/Fix30.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o out --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Failed build' }
      - uses: actions/upload-artifact@v4
        with:
          name: Fix31-IL-Editor
          path: out/*
          if-no-files-found: error
