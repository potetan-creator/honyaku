name: Build Fix23 Japanese Scroll binary editor
on:
  push:
    branches:
      - chatgpt/cdshelper-fix23-japanese-scroll-20261126
permissions:
  contents: read
jobs:
  compile:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish offline Linux-compatible Cecil editor
        shell: pwsh
        run: |
          dotnet publish tools/Fix23/Fix23.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o out --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Compiler failure' }
      - uses: actions/upload-artifact@v4
        with:
          name: Fix23-IL-Editor
          path: out/*
          if-no-files-found: error
