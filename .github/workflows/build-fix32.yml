name: Build Fix32 selection-label and city-name editor
on:
  push:
    branches:
      - chatgpt/cdshelper-fix32-combobox-20261126
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Compile Cecil editor for offline Linux
        shell: pwsh
        run: |
          dotnet publish tools/Fix32/Fix32.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o out --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: Fix32-IL-Editor
          path: out/*
          if-no-files-found: error
