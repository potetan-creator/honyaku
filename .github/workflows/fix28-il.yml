name: Build Fix28 Cecil IL inspector
on:
  push:
    branches: [chatgpt/cdshelper-fix28-landbattle-20261126]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - shell: pwsh
        run: |
          dotnet publish tools/Fix28/Fix28.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o out --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: Fix28-ILTool
          path: out/*
